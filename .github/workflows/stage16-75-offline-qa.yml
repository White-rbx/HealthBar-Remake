name: Stage 16.75 Cron Retry — Offline QA

on:
  push:
    branches:
      - stage16-63-protected-http-test
    paths:
      - 'sandbox/stage16-75-*'
      - 'sandbox/test_stage16_75_sqlite.py'
      - 'sandbox/stage16-74-push-outbox-helpers.js'
      - 'migrations/2026-11-16_stage1674_push_delivery_outbox_sandbox_draft.sql'
      - '.github/workflows/stage16-75-offline-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1675-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cron-unit-tests:
    if: github.ref == 'refs/heads/stage16-63-protected-http-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify Node version
        run: node --version

      - name: Offline Cron and route tests
        run: node --test sandbox/stage16-75-*.test.mjs

      - name: Verify Python SQLite version
        run: python3 -c 'import sqlite3; print(sqlite3.sqlite_version)'

      - name: Run actual SQLite Outbox/Cron SQL contracts
        run: python3 -m unittest discover -s sandbox -p 'test_stage16_75_sqlite.py' -v

      - name: Validate no Cron deployment side effects
        run: |
          test -f sandbox/stage16-75-cron-retry-runner.js
          test -f sandbox/stage16-75-cron-assembly.test.mjs
          ! grep -R -E 'wrangler deploy|cloudflare\.request|--api-token|CF_API_TOKEN' sandbox/stage16-75-cron*.test.mjs
