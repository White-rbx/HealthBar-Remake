name: Stage 16.80 — Verified History Offline QA
on:
  push:
    branches:
      - stage16-80-verified-violation-history
  pull_request:
    paths:
      - 'sandbox/stage16-80-*'
      - 'sandbox/test_stage16_80_sqlite.py'
      - 'migrations/*stage1680*'
      - '.github/workflows/stage16-80-verified-history-offline.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node contract tests
        run: node --test sandbox/stage16-80-verified-violation-history.test.mjs
      - name: SQLite migration and isolation checks
        run: python sandbox/test_stage16_80_sqlite.py
