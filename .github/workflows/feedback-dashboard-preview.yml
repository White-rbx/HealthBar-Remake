name: Feedback Dashboard - Offline Review Preview
on:
  push:
    branches: [feedback-appeal-release-track]
    paths:
      - '.github/workflows/feedback-dashboard-preview.yml'
      - 'sandbox/feedback-dashboard-staging-adapter.mjs'
      - 'sandbox/feedback-dashboard-staging-adapter.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable STAGING Pages deployment (public assets only)
        run: |
          set -euo pipefail
          mkdir -p dashboard-preview
          curl -fL --retry 2 --max-time 25 -sS "https://416b162f.arcscriptcenter-dashboard-staging.pages.dev/" -o dashboard-preview/index-source.html
          curl -fL --retry 2 --max-time 25 -sS "https://416b162f.arcscriptcenter-dashboard-staging.pages.dev/acs-logo.png" -o dashboard-preview/acs-logo.png
      - name: Verify pinned source hash and apply single-purpose additive adapter
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {prepareFeedbackDashboardStagingHtml} from './sandbox/feedback-dashboard-staging-adapter.mjs';
          const source=fs.readFileSync('dashboard-preview/index-source.html','utf8');
          const md5=crypto.createHash('md5').update(source).digest('hex');
          // Cloudflare Pages deployment file manifest from immutable STAGING deployment:
          const expected='35c63af97a960d9d03647dd5bfd9e8bc';
          console.log('STAGING pinned source checksum:',md5);
          if(md5!==expected)throw Error('Source content differs from Cloudflare deployment manifest: stop, do not reuse');
          const html=prepareFeedbackDashboardStagingHtml(source);
          if(!html.includes('id="page-feedback"'))throw Error('No Feedback tab generated');
          if(!html.includes('Claimed UserId: '))throw Error('Unverified sender label missing');
          fs.writeFileSync('dashboard-preview/index.html',html);
          fs.writeFileSync('dashboard-preview/README.txt',
            'REVIEW-ONLY Dashboard preview based on immutable STAGING Pages deployment.\n'+
            'Contains an Admin-only, read-only Feedback case list with claimed UserId labeled Unverified.\n'+
            'NO Cloudflare deployment. NO Production changes. Admin API must separately authorize each request.\n');
          fs.unlinkSync('dashboard-preview/index-source.html');
          JS
      - name: Verify Node test suite for dashboard patch
        run: node --test sandbox/feedback-dashboard-staging-adapter.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arcsen-feedback-dashboard-preview-review-only
          path: dashboard-preview/
          if-no-files-found: error
          retention-days: 7
